<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pasaporte de Bacalar</title>
<style>
:root{--g:#254f43;--gold:#c49a4a;--paper:#fff9eb}*{box-sizing:border-box}body{margin:0;background:#e5eadf;color:#344239;font-family:Georgia,serif}.scene{min-height:100vh;padding:20px}.wrap{max-width:1000px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;font:12px Arial;color:var(--g);letter-spacing:2px;margin-bottom:14px}.meter{height:6px;width:180px;background:#cbd3c7;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--g)}.layout{display:grid;grid-template-columns:1fr 125px;gap:15px;align-items:center}.book{filter:drop-shadow(0 12px 18px #24382d30)}.spread{display:grid;grid-template-columns:1fr 1fr;min-height:590px;background:var(--paper);border:1px solid #d2c5a9;border-radius:5px;overflow:hidden;position:relative}.spread.bookmode:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:20px;transform:translateX(-50%);background:linear-gradient(90deg,#8b806022,#fff9eb,#8b806022);pointer-events:none}.leaf{padding:24px 22px;position:relative;border-right:1px solid #e3d8c4}.leaf:nth-child(2){border:0}.label{font:10px Arial;letter-spacing:2px;color:#898d7f;border-bottom:1px solid #ddd3c0;padding-bottom:9px;margin-bottom:14px}.cover,.finish{grid-column:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px;background:linear-gradient(145deg,#244f43,#173a32);color:#fff7df}.cover h1{font-size:clamp(40px,7vw,70px);font-weight:normal;line-height:.98;margin:12px}.cover p,.finish p{font:14px/1.7 Arial;max-width:520px}.cover img{max-height:150px;max-width:100%;object-fit:contain}.cover button,.btn{border:0;background:var(--gold);padding:12px 18px;color:#263d32;cursor:pointer;font:700 12px Arial}.sealintro{border:1px solid #d9bf7a;border-radius:50%;width:85px;height:85px;display:grid;place-items:center;font:11px Arial;margin:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 8px}.stampcard{border:0;background:none;text-align:center;cursor:pointer;color:#344239;padding:0}.stamp{width:min(100%,125px);aspect-ratio:1;border-radius:50%;margin:auto auto 7px;border:2px dashed #aaa99b;background:radial-gradient(circle,#e4e2d9,#c7c9be);display:grid;place-items:center;overflow:hidden;filter:grayscale(1);position:relative}.stamp:after{content:"";position:absolute;inset:6px;border:1px dashed #999;border-radius:50%}.stamp img{width:100%;height:100%;object-fit:cover}.stampcard.done .stamp{filter:none;border:3px solid var(--g);background:#dcebdc;animation:pop .4s}.stampcard.sel .stamp{outline:3px solid var(--gold);outline-offset:3px}@keyframes pop{0%{transform:scale(.8)}70%{transform:scale(1.07)}100%{transform:scale(1)}}.stampname{display:block;font:700 12px Arial}.type{font:10px Arial;color:#858b7e}.detail{margin-top:15px;padding:12px;background:#f2eddf;border-left:3px solid var(--gold);font:12px/1.5 Arial}.detail strong{display:block;color:var(--g);font-size:10px;letter-spacing:1px;text-transform:uppercase}.entry{display:flex;gap:6px}.entry input{min-width:0;flex:1;padding:10px;border:1px solid #c9c1ae}.entry button{background:var(--g);color:white;border:0;padding:8px 12px}.msg{font:11px Arial;color:#a04c37;min-height:15px}.good{color:#286747}.foot{position:absolute;bottom:10px;left:0;right:0;text-align:center;font:9px Arial;color:#aaa28e;letter-spacing:1px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.nav button,.secondary{background:#faf6e9;border:1px solid #bcb7a8;color:var(--g);padding:10px 13px;cursor:pointer;font:12px Arial}.mascot{text-align:center;font:12px/1.4 Arial;color:var(--g)}.mascot img{width:100%;object-fit:contain}.bottom{text-align:center;font:11px Arial;color:#637264;margin:14px}.finish{background:var(--paper);color:#344239;min-height:590px}.finish h2{font-weight:normal;color:var(--g);font-size:40px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;width:min(100%,600px);margin:12px}.summary .stamp{max-width:90px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover{grid-column:2!important;background:linear-gradient(145deg,#244f43,#173a32)}
.finish{grid-column:1!important;background:linear-gradient(145deg,#244f43,#173a32)!important;color:#fff7df!important}
.finish h2{color:#fff7df}
.emptyleaf{background:transparent!important;border:0!important;padding:0!important}.spread:has(.emptyleaf){background:transparent!important;border:0!important;overflow:visible}.spread:has(.cover),.spread:has(.finish){box-shadow:none}
@keyframes pageTurn{0%{opacity:.35;transform:perspective(900px) rotateY(-8deg)}100%{opacity:1;transform:perspective(900px) rotateY(0)}}
.spread.bookmode .leaf{animation:pageTurn .65s ease both;transform-origin:left center}.spread.bookmode{animation:bookFlip .65s ease both;transform-origin:center center}@keyframes bookFlip{0%{transform:perspective(1200px) rotateY(-7deg);opacity:.7}100%{transform:perspective(1200px) rotateY(0);opacity:1}}
@media(max-width:650px){
 .layout{grid-template-columns:minmax(0,1fr)}
 .book{width:100%;min-width:0}
 .spread{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;min-height:470px!important}
 .leaf{min-width:0;min-height:470px;padding:12px 7px}
 .leaf:nth-child(2){border-top:0}
 .grid{grid-template-columns:1fr 1fr;gap:12px 4px}
 .stamp{width:min(100%,76px)}
 .stampname{font-size:9px}
 .type{font-size:8px}
 .detail{font-size:10px;padding:8px;margin-top:8px}
 .entry{flex-direction:column}
 .cover,.finish{grid-column:2!important}
 .finish{grid-column:1!important}
 .mascot{display:flex;align-items:center;justify-content:center;gap:10px}
 .mascot img{width:60px;height:60px}
 .mascot .fallback{font-size:36px}
}
@media(max-width:380px){.leaf{padding:14px 8px}.stamp{width:80px}.stampname{font-size:10px}}
</style>
<div class="scene" id="scene"><div class="wrap"><header class="head"><b>PASAPORTE DE BACALAR</b><div class="meter"><i id="bar"></i></div><span id="count">0 / 5</span></header><div class="layout"><div class="book"><div class="spread" id="spread"></div><div class="nav"><button id="prev" onclick="turn(-1)">← Anterior</button><span id="pageno" style="font:11px Arial">Portada</span><button id="next" onclick="turn(1)">Abrir →</button></div></div><aside class="mascot"><div id="mascotart"><div class="fallback" style="font-size:60px">🐌</div></div><p id="mascottext">¡Vamos despacito!<br>Hay mucho por descubrir.</p></aside></div><p class="bottom">Explora con respeto. No necesitas comprar ni pedir ayuda al personal para conseguir tus sellos.</p></div></div>
<script>
/* PERSONALIZA: pon las rutas de tus dibujos y edita pistas/códigos aquí. */
const settings={background:"",cover:"",mascot:"",mascotName:"Caracolito"};
const places=[
{name:"Frutería Daisy",type:"Comercio local",clue:"Camina tres cuadras detrás de la costera. Busca la palabra clave en la pizarra de frutas de temporada.",code:"MANGO",image:""},
{name:"Mural de la memoria",type:"Mural cultural",clue:"Observa el mural con calma y encuentra la palabra escondida en la obra.",code:"CEIBA",image:""},
{name:"La tiendita de la esquina",type:"Comercio local",clue:"Explora el entorno y localiza el código público colocado para visitantes.",code:"CANELA",image:""},
{name:"Mural del agua",type:"Mural cultural",clue:"Busca la palabra clave integrada discretamente en el mural, sin tocar la obra.",code:"LAGUNA",image:""},
{name:"Mercado tradicional",type:"Comercio local",clue:"Encuentra el letrero visible para visitantes. No hace falta comprar.",code:"CHAYA",image:""}];
let spread=0,selected=0;const got=new Set(JSON.parse(localStorage.getItem("bacalar-stamps")||"[]"));const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function norm(s){return s.trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase()}
function card(i){let p=places[i],done=got.has(i);return `<button class="stampcard ${done?"done":""} ${selected===i?"sel":""}" onclick="selectStamp(${i})"><span class="stamp">${done&&p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:`<span>${done?"✳":"?"}</span>`}</span><span class="stampname">${esc(p.name)}</span><span class="type">${done?"Sello obtenido":p.type}</span></button>`}
function detail(){let p=places[selected],done=got.has(selected);return `<div class="detail"><strong>${done?"✳ Sello obtenido":"Pista · "+esc(p.type)}</strong><b>${esc(p.name)}</b><p>${esc(p.clue)}</p>${done?'<div class="msg good">Esta estampa ya forma parte de tu pasaporte.</div>':`<div class="entry"><input id="answer" placeholder="Escribe la palabra clave"><button onclick="validate()">Sellar</button></div><div class="msg" id="msg"></div>`}</div>`}
function render(){ $("count").textContent=got.size+" / "+places.length;$("bar").style.width=(got.size/places.length*100)+"%";$("mascotart").innerHTML=settings.mascot?`<img src="${esc(settings.mascot)}" alt="${esc(settings.mascotName)}">`:'<div class="fallback" style="font-size:60px">🐌</div>';$("scene").style.backgroundImage=settings.background?`linear-gradient(#e8eee1d9,#e8eee1e8),url("${settings.background}")`:"linear-gradient(#e8eee1d9,#e8eee1e8)";$("prev").disabled=spread===0;$("next").textContent=spread===0?"Abrir →":spread===2?"Finalizar":"Siguiente →";$("pageno").textContent=spread===0?"Portada":spread===3?"Final":"Páginas "+((spread-1)*4+1)+"–"+Math.min(spread*4,places.length);
if(spread===0){$("spread").className="spread";$("spread").innerHTML=`<div class="leaf emptyleaf"></div><div class="cover"><div style="font:10px Arial;letter-spacing:3px;color:#e1c77f">MÉXICO · QUINTANA ROO</div>${settings.cover?`<img src="${esc(settings.cover)}" alt="Paisaje">`:""}<h1>Pasaporte<br>de Bacalar</h1><p>Un recorrido para descubrir el barrio, reconocer su cultura y apoyar la vida local a tu propio ritmo.</p><div class="sealintro">RUTA<br>CONSCIENTE<br>✳</div><button onclick="turn(1)">Abrir mi pasaporte →</button></div>`;return}
if(spread===3){$("spread").className="spread";finish();return}$("spread").className="spread bookmode";let start=(spread-1)*4,items=places.slice(start,start+4),left=items.slice(0,2),right=items.slice(2);function leaf(arr,off){let filled=arr.slice();while(filled.length<2&&places.length){filled.push(places[(start+off+filled.length)%places.length]);}return `<section class="leaf"><div class="label">Pasaporte · Colección de sellos</div><div class="grid">${filled.map((p,j)=>card(places.indexOf(p))).join("")}</div>${off===0?detail():""}<div class="foot">EXPLORAR · RESPETAR · RECONOCER</div></section>`}$("spread").innerHTML=leaf(left,0)+leaf(right,2)}
function selectStamp(i){selected=i;render()}function validate(){let a=$("answer"),m=$("msg");if(norm(a.value)===norm(places[selected].code)){got.add(selected);localStorage.setItem("bacalar-stamps",JSON.stringify([...got]));render()}else{m.textContent="No coincide. Revisa la pista e inténtalo de nuevo.";a.focus()}}
function turn(d){spread=d>0?Math.min(3,spread+1):Math.max(0,spread-1);render()}
function finish(){$("spread").innerHTML=`<div class="finish"><div class="label">Pasaporte de Bacalar · Recuerdo de viaje</div><div style="font-size:38px">✳ 🌿 ✳</div><h2>${got.size===places.length?"¡Pasaporte completo!":"¡Gracias por explorar!"}</h2><p>${got.size===places.length?"¡Lo lograste! Descubriste todos los nodos.":"Tu recorrido puede continuar cuando quieras. Cada lugar descubierto cuenta."} Conociste espacios culturales y la vida local de Bacalar a tu propio ritmo.</p><div class="summary">${places.map((p,i)=>`<div><div class="stamp ${got.has(i)?"done":""}">${got.has(i)&&p.image?`<img src="${esc(p.image)}">`:`<span>${got.has(i)?"✳":"?"}</span>`}</div><div style="font:10px Arial;text-align:center">${esc(p.name)}</div></div>`).join("")}</div><p>¿Te gustó el recorrido? Comparte tu pasaporte e invita a alguien a descubrir Bacalar.</p><div class="actions"><button class="btn" onclick="downloadPassport()">Guardar mi pasaporte</button><button class="secondary" onclick="shareText()">Compartir invitación</button><button class="secondary" onclick="spread=1;render()">Volver al libro</button></div></div><div class="leaf emptyleaf"></div>`}
function downloadPassport(){let c=document.createElement("canvas");c.width=1200;c.height=1400;let x=c.getContext("2d");x.fillStyle="#fff9eb";x.fillRect(0,0,1200,1400);x.strokeStyle="#254f43";x.lineWidth=9;x.strokeRect(30,30,1140,1340);x.textAlign="center";x.fillStyle="#254f43";x.font="28px Georgia";x.fillText("MÉXICO · QUINTANA ROO",600,110);x.font="62px Georgia";x.fillText("Pasaporte de Bacalar",600,205);x.font="24px Arial";x.fillText("Mi recorrido consciente",600,250);
let pending=places.filter(p=>got.has(places.indexOf(p))&&p.image).length;let images=[];places.forEach((p,i)=>{let col=i%3,row=Math.floor(i/3),cx=260+col*340,cy=440+row*330,r=100;x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=got.has(i)?"#dcebdc":"#e5e2d8";x.fill();x.lineWidth=got.has(i)?8:4;x.strokeStyle=got.has(i)?"#254f43":"#b8b9ad";x.stroke();if(got.has(i)&&p.image){let im=new Image();im.onload=()=>{x.save();x.beginPath();x.arc(cx,cy,r-5,0,7);x.clip();x.drawImage(im,cx-r+5,cy-r+5,(r-5)*2,(r-5)*2);x.restore();x.fillStyle="#344239";x.font="20px Arial";x.fillText(p.name,cx,cy+r+32)};im.src=p.image}else{x.fillStyle="#254f43";x.font="40px Georgia";x.fillText(got.has(i)?"✳":"?",cx,cy+14)}x.fillStyle="#344239";x.font="20px Arial";x.fillText(p.name,cx,cy+r+32)});x.fillStyle="#254f43";x.font="28px Georgia";x.fillText(`${got.size} de ${places.length} sellos obtenidos`,600,1190);x.font="22px Arial";x.fillText("Explorar · Respetar · Reconocer",600,1250);let a=document.createElement("a");a.download="mi-pasaporte-bacalar.png";a.href=c.toDataURL("image/png");a.click()}
function shareText(){let t=`¡Estoy explorando Bacalar con el Pasaporte de Bacalar! Ya conseguí ${got.size} de ${places.length} sellos. Descubre lugares, cultura y vida local a tu ritmo.`;if(navigator.share)navigator.share({title:"Pasaporte de Bacalar",text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Texto copiado. ¡Pégalo en tus redes!"));else alert(t)}
let tx=null;$("spread").addEventListener("touchstart",e=>tx=e.changedTouches[0].screenX,{passive:true});$("spread").addEventListener("touchend",e=>{if(tx===null)return;let dx=e.changedTouches[0].screenX-tx;if(Math.abs(dx)>60)turn(dx<0?1:-1);tx=null},{passive:true});document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.key==="Enter"){validate();return}if(e.key==="ArrowRight")turn(1);if(e.key==="ArrowLeft")turn(-1)});render();
</script></html>
